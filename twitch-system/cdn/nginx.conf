# CDN edge — caches HLS from the origin (encoding-service) and serves viewers.
#
# .m3u8 playlists change every ~4s  -> short cache (2s)
# .ts  segments are immutable       -> long cache (10m)

worker_processes auto;
events { worker_connections 1024; }

http {
    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=cdn:10m max_size=1g inactive=60m;

    upstream origin {
        server encoding-service:8080;
    }

    server {
        listen 80;

        location ~* /hls/.*\.m3u8$ {
            proxy_pass http://origin;
            proxy_cache cdn;
            proxy_cache_valid 200 2s;
            proxy_cache_lock on;
            proxy_cache_key "$uri";
            add_header Access-Control-Allow-Origin *;
            add_header X-Cache-Status $upstream_cache_status;
        }

        location ~* /hls/.*\.ts$ {
            proxy_pass http://origin;
            proxy_cache cdn;
            proxy_cache_valid 200 10m;
            proxy_cache_lock on;
            proxy_cache_key "$uri";
            add_header Access-Control-Allow-Origin *;
            add_header X-Cache-Status $upstream_cache_status;
        }
    }
}
